tracker_type: botsort

track_high_thresh: 0.7
track_low_thresh:  0.2
new_track_thresh:  0.5
track_buffer:      180     # keep predicting for 90 frames after lost
match_thresh:      0.7
fuse_score:        True
proximity_thresh: 0.1
appearance_thresh: 0.6

gmc_method: sparseOptFlow     # handles camera motion
with_reid: False  
model: yolo26n-cls.pt